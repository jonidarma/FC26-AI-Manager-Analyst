appId: com.fc26aimanager.desktop
productName: FC26 AI Manager
copyright: Copyright © 2026 FC26 AI Manager
directories:
  output: release
  buildResources: build
extraMetadata:
  main: dist-electron/main.cjs
files:
  - dist/**/*
  - dist-electron/**/*
  - dist-server/**/*
  - package.json
  - "!node_modules/vite/**"
  - "!node_modules/typescript/**"
  - "!node_modules/tsx/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "dist-server/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "FC26 AI Manager — Windows Setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FC26 AI Manager
